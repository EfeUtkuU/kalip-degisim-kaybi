name: Uygulamayı derle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Arayüz
        shell: bash
        run: |
          cd frontend
          npm install --no-audit --no-fund
          npm run build
          cd ..
          rm -rf backend/frontend_dist
          cp -R frontend/dist backend/frontend_dist
      - name: Python paketleri
        shell: bash
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-desktop.txt
          python make_icon.py || echo "simge üretilemedi"
      - name: Paketle
        shell: bash
        run: |
          cd backend
          pyinstaller --noconfirm KalipDegisimKaybi.spec
      - name: Paket kontrolü
        shell: bash
        run: |
          cd backend
          if [ "$RUNNER_OS" = "Windows" ]; then ./dist/KalipDegisimKaybi/KalipDegisimKaybi.exe --smoke-test; else ./dist/KalipDegisimKaybi.app/Contents/MacOS/KalipDegisimKaybi --smoke-test; fi
      - name: Zip
        shell: bash
        run: |
          cd backend/dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../../KalipDegisimKaybi-windows.zip KalipDegisimKaybi; else ditto -c -k --keepParent KalipDegisimKaybi.app ../../KalipDegisimKaybi-macos.zip; fi
      - uses: actions/upload-artifact@v4
        with:
          name: KalipDegisimKaybi-${{ runner.os }}
          path: KalipDegisimKaybi-*.zip
